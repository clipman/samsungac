device:
  poll: True
  connection:
    type: request
    params:
      verify: False
      headers: { "Authorization": "Bearer __CLIMATE_IP_TOKEN__", "Content-Type": "application/json" }
  status:
    type: 'json_status'
    connection:
      params: { method : 'GET', url: 'https://__CLIMATE_IP_HOST__:8888/devices' }
  operations:
    hvac: # hvac_mode
      type: modes
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__/mode' }
      values:
        'cool': { value : 'Cool', connection: { params: { json: { "modes": ["Cool"] } }, connection: { params: { json: { "Operation": { "power" : "On" } }, url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__' }, condition_template: "{% if device_state.Devices.0.Operation.power == 'Off' -%}1{%- else -%}0{%- endif %}" } } }
        # 'heat': { value : 'Heat', connection: { params: { json: { "modes": ["Heat"] } }, connection: { params: { json: { "Operation": { "power" : "On" } }, url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__' }, condition_template: "{% if device_state.Devices.0.Operation.power == 'Off' -%}1{%- else -%}0{%- endif %}" } } }
        'dry': { value : 'Dry', connection: { params: { json: { "modes": ["Dry"] } }, connection: { params: { json: { "Operation": { "power" : "On" } }, url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__' }, condition_template: "{% if device_state.Devices.0.Operation.power == 'Off' -%}1{%- else -%}0{%- endif %}" } } }
        'fan_only': { value : 'Wind', connection: { params: { json: { "modes": ["Wind"] } }, connection: { params: { json: { "Operation": { "power" : "On" } }, url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__' }, condition_template: "{% if device_state.Devices.0.Operation.power == 'Off' -%}1{%- else -%}0{%- endif %}" } } }
        'auto': { value : 'Auto', connection: { params: { json: { "modes": ["Auto"] } }, connection: { params: { json: { "Operation": { "power" : "On" } }, url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__' }, condition_template: "{% if device_state.Devices.0.Operation.power == 'Off' -%}1{%- else -%}0{%- endif %}" } } }
        'off': { value : 'Off', connection: { params: { json: { "Operation": { "power" : "Off" } }, url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__' }, condition_template: "{% if device_state.Devices.0.Operation.power == 'On' -%}1{%- else -%}0{%- endif %}" } }
      status_template: "{% if device_state.Devices.0.Operation.power == 'Off' -%}{{ device_state.Devices.0.Operation.power }}{%- else -%}{{ device_state.Devices.0.Mode.modes.0 }}{%- endif %}"
    preset: # preset_mode
      type: modes
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__/mode' }
      values:
        'None': { value : 'Comode_Off', connection: { params: { json: { "options": ["Comode_Off"] } } } }
        'Good Sleep': { value : 'Comode_Sleep', connection: { params: { json: { "options": ["Comode_Sleep"] } } } }
        'Fast Turbo': { value : 'Comode_Speed', connection: { params: { json: { "options": ["Comode_Speed"] } } } }
        '2 Step': { value : 'Comode_2Step', connection: { params: { json: { "options": ["Comode_2Step"] } } } }
        'Comfort': { value : 'Comode_Comfort', connection: { params: { json: { "options": ["Comode_Comfort"] } } } }
        'Quiet': { value : 'Comode_Quiet', connection: { params: { json: { "options": ["Comode_Quiet"] } } } }
        'Single User': { value : 'Comode_Smart', connection: { params: { json: { "options": ["Comode_Smart"] } } } }
        'Wind Free': { value : 'Comode_Nano', connection: { params: { json: { "options": ["Comode_Nano"] } } } }
      # 인덱스가 아니라 'Comode_' 접두어로 검색합니다.
      # (거실 유닛은 options 배열 맨 앞에 'Operation_Family'가 하나 더 있어서
      #  고정 인덱스(0)로 읽으면 안방 유닛과 어긋납니다.)
      status_template: >-
        {%- for o in device_state.Devices.0.Mode.options -%}
          {%- if o.startswith('Comode_') -%}{{ o }}{%- endif -%}
        {%- endfor -%}
    power:
      type: switch
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__' }
      values:
        'off': { value: 'Off', connection: { params: { json: { "Operation": { "power" : "Off" } } } } }
        'on': { value: 'On', connection: { params: { json: { "Operation": { "power" : "On" } } } } }
      status_template: '{{ device_state.Devices.0.Operation.power }}'
    purify:
      # 참고: 두 기기 응답 어디에도 'Spi_'로 시작하는 옵션이 보이지 않습니다.
      # 이 기종/펌웨어에서는 지원되지 않는 기능일 수 있으니 실제 동작 확인이 필요합니다.
      type: switch
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__/mode' }
      values:
        'off': { value: 'Spi_Off', connection: { params: { json: { "options": [ "Spi_Off"] } } } }
        'on': { value: 'Spi_On', connection: { params: { json: { "options": [ "Spi_On"] } } } }
      status_template: '{{ device_state.Devices.0.Mode.options.3 }}'
    auto_clean:
      type: switch
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__/mode' }
      values:
        'off': { value: 'Autoclean_Off', connection: { params: { json: { "options": [ "Autoclean_Off"] } } } }
        'on': { value: 'Autoclean_On', connection: { params: { json: { "options": [ "Autoclean_On"] } } } }
      status_template: >-
        {%- for o in device_state.Devices.0.Mode.options -%}
          {%- if o.startswith('Autoclean_') -%}{{ o }}{%- endif -%}
        {%- endfor -%}
    beep:
      type: switch
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__/mode' }
      values:
        'off': { value: 'Volume_Mute', connection: { params: { json: { "options": [ "Volume_Mute"] } } } }
        'on': { value: 'Volume_100', connection: { params: { json: { "options": [ "Volume_100"] } } } }
      # 인덱스(14) 대신 'Volume_' 접두어로 검색합니다. 단, 기기가 'Volume_33'처럼
      # on/off 외의 값을 보고할 수도 있어 그 경우는 그대로 원문이 표시됩니다.
      status_template: >-
        {%- for o in device_state.Devices.0.Mode.options -%}
          {%- if o.startswith('Volume_') -%}{{ o }}{%- endif -%}
        {%- endfor -%}
    special: # special_mode
      type: modes
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__/mode' }
      values:
        'Off': { value : 'Comode_Off', connection: { params: { json: { "options": ["Comode_Off"] } } } }
        'Good Sleep': { value : 'Comode_Sleep', connection: { params: { json: { "options": ["Comode_Sleep"] } } } }
        'Fast Turbo': { value : 'Comode_Speed', connection: { params: { json: { "options": ["Comode_Speed"] } } } }
        '2 Step': { value : 'Comode_2Step', connection: { params: { json: { "options": ["Comode_2Step"] } } } }
        'Comfort': { value : 'Comode_Comfort', connection: { params: { json: { "options": ["Comode_Comfort"] } } } }
        'Quiet': { value : 'Comode_Quiet', connection: { params: { json: { "options": ["Comode_Quiet"] } } } }
        'Single User': { value : 'Comode_Smart', connection: { params: { json: { "options": ["Comode_Smart"] } } } }
        'Wind Free': { value : 'Comode_Nano', connection: { params: { json: { "options": ["Comode_Nano"] } } } }
      status_template: >-
        {%- for o in device_state.Devices.0.Mode.options -%}
          {%- if o.startswith('Comode_') -%}{{ o }}{%- endif -%}
        {%- endfor -%}
    fan: # fan_mode
      type: modes
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__/wind' }
      values:
        'auto': { value : '0', connection: { params: { json: { "speedLevel": 0 } } } }
        'low': { value : '1', connection: { params: { json: { "speedLevel": 1 } } } }
        'medium': { value : '2', connection: { params: { json: { "speedLevel": 2 } } } }
        'high': { value : '3', connection: { params: { json: { "speedLevel": 3 } } } }
        'Turbo': { value : '4', connection: { params: { json: { "speedLevel": 4 } } } }
      status_template: '{{ device_state.Devices.0.Wind.speedLevel }}'
    fan_max: # fan_max_mode
      type: modes
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__/wind' }
      values:
        'auto': { value : '0', connection: { params: { json: { "maxSpeedLevel": 0 } } } }
        'low': { value : '1', connection: { params: { json: { "maxSpeedLevel": 1 } } } }
        'medium': { value : '2', connection: { params: { json: { "maxSpeedLevel": 2 } } } }
        'high': { value : '3', connection: { params: { json: { "maxSpeedLevel": 3 } } } }
        'Turbo': { value : '4', connection: { params: { json: { "maxSpeedLevel": 4 } } } }
      status_template: '{{ device_state.Devices.0.Wind.maxSpeedLevel }}'
    swing: # swing_mode
      type: modes
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__/wind' }
      values:
        'off': { value : "Fix", connection: { params: { json: { "direction": "Fix" } } } }
        'vertical': { value : "Up_And_Low", connection: { params: { json: { "direction": "Up_And_Low" } } } }
        'horizontal': { value : "Left_And_Right", connection: { params: { json: { "direction": "Left_And_Right" } } } }
        'both': { value : "All", connection: { params: { json: { "direction": "All" } } } }
      # 거실 유닛은 '스윙 안 함' 상태를 'Off'로, 안방 유닛은 'Fix'로 보고합니다.
      # 둘 다 같은 의미이므로 'Off'를 'Fix'로 정규화해서 'off' 프리셋과 매핑되게 합니다.
      status_template: >-
        {%- set d = device_state.Devices.0.Wind.direction -%}
        {%- if d == 'Off' -%}Fix{%- else -%}{{ d }}{%- endif -%}
    good_sleep:
      type: number
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__/mode'  }
      min: 0
      max: 24
      status_template: >-
        {%- for o in device_state.Devices.0.Mode.options -%}
          {%- if o.startswith('Sleep_') -%}{{ o[6:] }}{%- endif -%}
        {%- endfor -%}
      connection_template: '{ "json": { "options": ["Sleep_{{ value | int }}"] } }'
    temperature:
      type: number
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__/temperatures/0' }
      min: 8
      max: 30
      status_template: '{{ device_state.Devices.0.Temperatures.0.desired | int }}'
      connection_template: '{ "json": { "desired": {{ value | int }} } }'
      unit_template: '{{ device_state.Devices.0.Temperatures.0.unit }}'
  attributes:
    current_temperature:
      type: number
      status_template: '{{ device_state.Devices.0.Temperatures.0.current }}'
      unit_template: '{{ device_state.Devices.0.Temperatures.0.unit }}'
    min_temp:
      type: number
      status_template: '8'
      unit_template: '{{ device_state.Devices.0.Temperatures.0.unit }}'
    max_temp:
      type: number
      status_template: '30'
      unit_template: '{{ device_state.Devices.0.Temperatures.0.unit }}'
    # 아래 4개는 sensor.py 플랫폼에서 별도 센서 엔티티로 노출됩니다.
    # Sensors 배열은 기기마다 순서가 다를 수 있어 인덱스가 아니라 'type' 값으로 찾습니다.
    clean_level:
      type: number
      # 주의: s.values.0 은 안 됩니다. dict의 "values" 키가 파이썬 dict.values()
      # 메서드와 이름이 겹쳐서 점(dot) 표기로는 메서드 객체가 반환됩니다.
      # 반드시 s['values'][0] 처럼 대괄호로 접근해야 합니다.
      status_template: >-
        {%- for s in device_state.Devices.0.Sensors -%}
          {%- if s.type == 'CleanLevel' -%}{{ s['values'][0] }}{%- endif -%}
        {%- endfor -%}
    odor_level:
      type: number
      status_template: >-
        {%- for s in device_state.Devices.0.Sensors -%}
          {%- if s.type == 'Odor' -%}{{ s['values'][0] }}{%- endif -%}
        {%- endfor -%}
    pm10:
      # values[0] = 농도(μg/m³), values[1] = 등급 코드(예: 1=좋음)
      type: number
      status_template: >-
        {%- for s in device_state.Devices.0.Sensors -%}
          {%- if s.type == 'Dust' -%}{{ s['values'][0] }}{%- endif -%}
        {%- endfor -%}
    pm2_5:
      # values[0] = 농도(μg/m³), values[1] = 등급 코드
      type: number
      status_template: >-
        {%- for s in device_state.Devices.0.Sensors -%}
          {%- if s.type == 'FineDust' -%}{{ s['values'][0] }}{%- endif -%}
        {%- endfor -%}
    humidity:
      # Humidity 객체 자체가 없는 기기(예: 룸 에어컨)에서는 렌더링이
      # 비어있는 값이 되어 sensor.py 쪽에서 unknown 처리됩니다.
      type: number
      status_template: '{{ device_state.Devices.0.Humidity.current }}'
